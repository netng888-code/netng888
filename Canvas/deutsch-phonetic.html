<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>德語 → 英語拼音</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    /* light / "whiteboard" theme (default) */
    --bg: #F3F1EA;
    --panel: #FFFFFF;
    --frame: #B79B6B;
    --ink: #23291F;
    --dim: #6B7268;
    --accent: #2F6FA5;
    --accent-ink: #FFFFFF;
    --rule: #DAD5C6;
    --panel-shadow: none;
    --font-slab: 'Zilla Slab', Georgia, 'Times New Roman', serif;
    --font-hand: 'Patrick Hand', 'Segoe Print', 'Comic Sans MS', cursive;
    --radius: 6px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #182620;
      --panel: #1F332A;
      --frame: #5B4430;
      --ink: #EDE8DA;
      --dim: #9FB0A6;
      --accent: #E7C468;
      --accent-ink: #23291F;
      --rule: #3B4A3F;
      --panel-shadow: inset 0 0 60px rgba(0,0,0,0.25);
    }
  }

  :root[data-theme="dark"] {
    --bg: #182620;
    --panel: #1F332A;
    --frame: #5B4430;
    --ink: #EDE8DA;
    --dim: #9FB0A6;
    --accent: #E7C468;
    --accent-ink: #23291F;
    --rule: #3B4A3F;
    --panel-shadow: inset 0 0 60px rgba(0,0,0,0.25);
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-slab);
    min-height: 100%;
    -webkit-text-size-adjust: 100%;
  }

  .page { display: flex; justify-content: center; padding: clamp(1rem, 4vw, 3rem) clamp(0.75rem, 4vw, 1.5rem); }

  .board {
    width: 100%;
    max-width: 720px;
    background: var(--panel);
    border: 3px solid var(--frame);
    border-radius: var(--radius);
    box-shadow: var(--panel-shadow);
    padding: clamp(1.25rem, 4vw, 2.25rem);
  }

  header h1 { margin: 0 0 0.35rem 0; font-size: clamp(1.5rem, 4vw, 1.9rem); font-weight: 600; letter-spacing: 0.01em; }
  header p { margin: 0 0 1.5rem 0; color: var(--dim); font-size: 0.95rem; max-width: 62ch; line-height: 1.5; }

  textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    padding: 0.75rem 0.85rem;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1rem;
    line-height: 1.5;
  }

  textarea:focus-visible, button:focus-visible, summary:focus-visible, .word-pair:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .controls { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.9rem; align-items: center; }

  button {
    font-family: var(--font-slab);
    font-size: 0.95rem;
    font-weight: 600;
    padding: 0.55rem 1.1rem;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }

  .btn-secondary { background: transparent; color: var(--ink); border-color: var(--rule); }
  .btn-secondary:hover:not(:disabled) { background: var(--bg); }

  .toolbar-row { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 0.9rem; align-items: center; }
  .toolbar-group { display: flex; align-items: center; gap: 0.5rem; }
  .toolbar-label { font-size: 0.82rem; color: var(--dim); white-space: nowrap; }

  .seg-group {
    display: inline-flex;
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
  }
  .seg-group button {
    border: none;
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font-size: 0.85rem;
    font-weight: 500;
    padding: 0.4rem 0.75rem;
  }
  .seg-group button:not(:last-child) { border-right: 1px solid var(--rule); }
  .seg-group button.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .seg-group button:hover:not(.active):not(:disabled) { background: var(--bg); }

  #output {
    margin-top: 1.6rem;
    padding-top: 1.4rem;
    border-top: 1px dashed var(--rule);
    min-height: 2.5rem;
    line-height: 3.1;
    font-size: 1.1rem;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #output.show { opacity: 1; transform: translateY(0); }
  #output .hint { font-family: var(--font-slab); color: var(--dim); font-size: 0.95rem; }

  .word-pair, .punct-pair {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: top;
    margin: 0 0.15rem;
    line-height: 1.25;
    border-radius: 4px;
    padding: 0.05rem 0.15rem;
  }
  .word-pair { cursor: pointer; }
  .word-pair:hover, .word-pair:focus-visible { background: var(--rule); }

  .word-pair .de, .punct-pair .de { font-family: var(--font-slab); font-weight: 500; color: var(--ink); font-size: 1.05rem; }
  .word-pair .ph { font-family: var(--font-hand); color: var(--accent); font-size: 1.05rem; margin-top: -0.05rem; letter-spacing: 0.01em; }
  .punct-pair .ph { font-family: var(--font-hand); color: transparent; font-size: 1.05rem; margin-top: -0.05rem; }

  .paragraph-view p {
    line-height: 1.75;
    margin: 0 0 0.4rem 0;
    font-size: 1.05rem;
  }
  .paragraph-view .de-block { color: var(--ink); }
  .paragraph-view .ph-block { color: var(--accent); font-family: var(--font-hand); font-size: 1.1rem; }
  .paragraph-view .block-label { font-size: 0.78rem; color: var(--dim); font-family: var(--font-slab); margin: 0.9rem 0 0.15rem; text-transform: none; }
  .paragraph-view .block-label:first-child { margin-top: 0; }

  .speaker-icon { display: inline-block; transition: opacity 0.15s ease; }
  .btn-primary.speaking .speaker-icon { animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  details { margin-top: 1.6rem; border-top: 1px dashed var(--rule); padding-top: 1rem; }
  summary { cursor: pointer; font-weight: 600; color: var(--ink); }

  table { width: 100%; border-collapse: collapse; margin-top: 0.9rem; font-size: 0.92rem; }
  th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--rule); }
  th { color: var(--dim); font-weight: 600; }
  td.rule-col { white-space: nowrap; color: var(--ink); }
  td.example-col .de { font-weight: 500; }
  td.example-col .ph { font-family: var(--font-hand); color: var(--accent); margin-left: 0.4rem; }

  footer { margin-top: 1.6rem; color: var(--dim); font-size: 0.85rem; line-height: 1.6; }

  .tts-note { font-size: 0.82rem; color: var(--dim); margin-top: 0.4rem; }

  @media (prefers-reduced-motion: reduce) {
    #output { transition: none; }
    button { transition: none; }
    .btn-primary.speaking .speaker-icon { animation: none; }
  }
</style>
</head>
<body>
<div class="page">
  <main class="board">
    <header>
      <h1>德語 → 英語拼音</h1>
      <p>貼上德文,轉做用英文讀音習慣寫嘅大約發音,大楷標返邊個音節讀重;撳個字仲可以聽真人瀏覽器讀返個音。</p>
    </header>

    <textarea id="input" placeholder="喺呢度貼上德文…">Guten Tag! Wie geht es dir? Ich lerne Deutsch.</textarea>

    <div class="controls">
      <button class="btn-primary" id="convertBtn" type="button">轉做拼音</button>
      <button class="btn-secondary" id="exampleBtn" type="button">試下例句</button>
      <button class="btn-secondary" id="clearBtn" type="button">清空</button>
      <button class="btn-secondary" id="copyBtn" type="button" hidden>複製結果</button>
    </div>

    <div class="toolbar-row">
      <div class="toolbar-group">
        <span class="toolbar-label">檢視:</span>
        <div class="seg-group" id="viewModeGroup">
          <button type="button" data-mode="cards" class="active">逐詞卡</button>
          <button type="button" data-mode="paragraph">全段對照</button>
        </div>
      </div>
      <div class="toolbar-group">
        <span class="toolbar-label">語速:</span>
        <div class="seg-group" id="rateGroup">
          <button type="button" data-rate="0.75">0.75x</button>
          <button type="button" data-rate="1" class="active">1x</button>
          <button type="button" data-rate="1.25">1.25x</button>
        </div>
      </div>
      <button class="btn-primary" id="playAllBtn" type="button">
        <span class="speaker-icon">🔊</span> 播放全文
      </button>
    </div>
    <div class="tts-note" id="ttsNote" hidden>呢個瀏覽器唔支援語音朗讀,「播放」功能用唔到。</div>

    <div id="output"><span class="hint">按「轉做拼音」睇結果,或者撳個德文字聽讀音。</span></div>

    <details>
      <summary>發音對照規則</summary>
      <table id="legendTable">
        <thead><tr><th>德文寫法</th><th>讀音提示</th><th>例子</th></tr></thead>
        <tbody></tbody>
      </table>
    </details>

    <footer>
      呢個係簡化嘅英文拼音提示,唔係國際音標(IPA)。重音標示用咗一個簡單規則(頭一個音節通常讀重,但 be-/ge-/er-/ent-/emp-/ver-/zer- 呢類字頭多數唔讀重音,重音會去下一個音節),部分字(尤其外來詞)未必啱。語音朗讀靠瀏覽器內建嘅德文語音,音質同準確度視乎裝置。
    </footer>
  </main>
</div>

<script>
(function () {
  "use strict";

  var VOWEL_LETTERS = "aeiouäöüy";
  function isVowelLetter(ch) { return VOWEL_LETTERS.indexOf(ch) !== -1; }

  var UNSTRESSED_PREFIXES = ["ent", "emp", "zer", "ver", "ge", "be", "er"];
  var STRESS_EXCEPTIONS_FIRST = new Set([
    "gestern", "gerne", "erst", "erste", "ersten", "erster", "erstes",
    "erde", "erden", "beere", "beeren"
  ]);

  // ---- Core letter-to-sound chunking ----
  function buildChunks(rawWord) {
    var w = rawWord.toLowerCase();
    var len = w.length;
    var pos = 0;
    var chunks = [];

    function push(text, vowel) { chunks.push({ text: text, vowel: vowel }); }

    while (pos < len) {
      var rem = w.slice(pos);
      var isStart = pos === 0;
      var isEnd2 = pos + 2 === len;
      var matched = true;

      if (rem.indexOf("tsch") === 0) { push("ch", false); pos += 4; }
      else if (rem.indexOf("sch") === 0) { push("sh", false); pos += 3; }
      else if (rem.indexOf("chs") === 0) { push("x", false); pos += 3; }
      else if (isStart && rem.indexOf("sp") === 0) { push("shp", false); pos += 2; }
      else if (isStart && rem.indexOf("st") === 0) { push("sht", false); pos += 2; }
      else if (rem.indexOf("ck") === 0) { push("k", false); pos += 2; }
      else if (rem.indexOf("dt") === 0) { push("t", false); pos += 2; }
      else if (rem.indexOf("ph") === 0) { push("f", false); pos += 2; }
      else if (rem.indexOf("th") === 0) { push("t", false); pos += 2; }
      else if (rem.indexOf("ng") === 0) { push("ng", false); pos += 2; }
      else if (rem.indexOf("qu") === 0) { push("kv", false); pos += 2; }
      else if (rem.indexOf("ie") === 0) { push("ee", true); pos += 2; }
      else if (rem.indexOf("ei") === 0) { push("eye", true); pos += 2; }
      else if (rem.indexOf("äu") === 0) { push("oy", true); pos += 2; }
      else if (rem.indexOf("eu") === 0) { push("oy", true); pos += 2; }
      else if (rem.indexOf("au") === 0) { push("ow", true); pos += 2; }
      else if (rem.indexOf("aa") === 0) { push("ah", true); pos += 2; }
      else if (rem.indexOf("ee") === 0) { push("ay", true); pos += 2; }
      else if (rem.indexOf("oo") === 0) { push("oh", true); pos += 2; }
      else if (rem.indexOf("ah") === 0) { push("ah", true); pos += 2; }
      else if (rem.indexOf("äh") === 0) { push("eh", true); pos += 2; }
      else if (rem.indexOf("eh") === 0) { push("ay", true); pos += 2; }
      else if (rem.indexOf("ih") === 0) { push("ee", true); pos += 2; }
      else if (rem.indexOf("oh") === 0) { push("oh", true); pos += 2; }
      else if (rem.indexOf("öh") === 0) { push("ur", true); pos += 2; }
      else if (rem.indexOf("uh") === 0) { push("oo", true); pos += 2; }
      else if (rem.indexOf("üh") === 0) { push("ew", true); pos += 2; }
      else if (rem.indexOf("ch") === 0) { push("kh", false); pos += 2; }
      else if (isEnd2 && rem.indexOf("ig") === 0) { push("ikh", true); pos += 2; }
      else if (isEnd2 && rem.indexOf("er") === 0) { push("uh", true); pos += 2; }
      else { matched = false; }

      if (matched) continue;

      var c = rem.charAt(0);
      var next = rem.charAt(1);
      var isFinal = pos + 1 === len;

      switch (c) {
        case "a": push("ah", true); break;
        case "ä": push("eh", true); break;
        case "e": push(isFinal ? "uh" : "eh", true); break;
        case "i": push("ih", true); break;
        case "o": push("oh", true); break;
        case "ö": push("ur", true); break;
        case "u": push("oo", true); break;
        case "ü": push("ew", true); break;
        case "y": push("ew", true); break;
        case "v": push("f", false); break;
        case "w": push("v", false); break;
        case "z": push("ts", false); break;
        case "j": push("y", false); break;
        case "ß": push("ss", false); break;
        case "x": push("ks", false); break;
        case "q": push("k", false); break;
        case "b": push(isFinal ? "p" : "b", false); break;
        case "d": push(isFinal ? "t" : "d", false); break;
        case "g": push(isFinal ? "k" : "g", false); break;
        case "c": push(("eiöäy".indexOf(next) !== -1) ? "ts" : "k", false); break;
        case "s": push((isStart && isVowelLetter(next)) ? "z" : "s", false); break;
        default: push(c, false);
      }
      pos += 1;
    }
    return chunks;
  }

  // ---- Group chunks into syllables (max-onset-ish, digraphs kept whole) ----
  function syllabifyChunks(chunks) {
    var syllables = [];
    var buffer = [];

    function bufferText(list) { return list.map(function (c) { return c.text; }).join(""); }

    chunks.forEach(function (chunk) {
      if (chunk.vowel) {
        var onset;
        if (syllables.length === 0) {
          onset = bufferText(buffer);
        } else if (buffer.length <= 1) {
          onset = bufferText(buffer);
        } else {
          var coda = buffer.slice(0, buffer.length - 1);
          var onsetChunk = buffer[buffer.length - 1];
          syllables[syllables.length - 1] += bufferText(coda);
          onset = onsetChunk.text;
        }
        syllables.push(onset + chunk.text);
        buffer = [];
      } else {
        buffer.push(chunk);
      }
    });

    if (buffer.length) {
      if (syllables.length === 0) syllables.push(bufferText(buffer));
      else syllables[syllables.length - 1] += bufferText(buffer);
    }
    return syllables;
  }

  function formatStressed(syllables, stressIndex) {
    if (syllables.length === 0) return "";
    if (syllables.length === 1) return syllables[0].toUpperCase();
    return syllables.map(function (syl, idx) {
      return idx === stressIndex ? syl.toUpperCase() : syl;
    }).join("-");
  }

  function transliterateWord(word) {
    var lower = word.toLowerCase();
    var allSyllables, stressIndex;

    var usedPrefix = null;
    if (!STRESS_EXCEPTIONS_FIRST.has(lower)) {
      for (var i = 0; i < UNSTRESSED_PREFIXES.length; i++) {
        var p = UNSTRESSED_PREFIXES[i];
        if (lower.indexOf(p) === 0) {
          var remainder = lower.slice(p.length);
          if (remainder.length > 0 && /[aeiouäöüy]/.test(remainder)) {
            usedPrefix = p;
            break;
          }
        }
      }
    }

    if (usedPrefix) {
      var prefixSyll = syllabifyChunks(buildChunks(word.slice(0, usedPrefix.length)));
      var restSyll = syllabifyChunks(buildChunks(word.slice(usedPrefix.length)));
      allSyllables = prefixSyll.concat(restSyll);
      stressIndex = prefixSyll.length;
    } else {
      allSyllables = syllabifyChunks(buildChunks(word));
      stressIndex = 0;
    }

    return formatStressed(allSyllables, stressIndex);
  }

  // ---- Tokenizing free text into words / other ----
  function tokenize(text) {
    var re = /([A-Za-zÄÖÜäöüß]+)|([^A-Za-zÄÖÜäöüß]+)/g;
    var tokens = [];
    var m;
    while ((m = re.exec(text)) !== null) {
      if (m[1]) tokens.push({ type: "word", text: m[1] });
      else tokens.push({ type: "other", text: m[2] });
    }
    return tokens;
  }

  // ---- TTS ----
  var ttsSupported = "speechSynthesis" in window;
  var currentRate = 1;
  var germanVoice = null;

  function pickGermanVoice() {
    if (!ttsSupported) return;
    var voices = window.speechSynthesis.getVoices() || [];
    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang && voices[i].lang.toLowerCase().indexOf("de") === 0) {
        germanVoice = voices[i];
        return;
      }
    }
  }

  if (ttsSupported) {
    pickGermanVoice();
    if (typeof window.speechSynthesis.addEventListener === "function") {
      window.speechSynthesis.addEventListener("voiceschanged", pickGermanVoice);
    }
  } else {
    document.getElementById("ttsNote").hidden = false;
    document.getElementById("playAllBtn").disabled = true;
  }

  function speak(text, onEnd) {
    if (!ttsSupported || !text.trim()) return;
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = "de-DE";
    utter.rate = currentRate;
    if (germanVoice) utter.voice = germanVoice;
    if (onEnd) {
      utter.onend = onEnd;
      utter.onerror = onEnd;
    }
    window.speechSynthesis.speak(utter);
  }

  // ---- Rendering ----
  var viewMode = "cards";

  function renderCards(tokens, container) {
    tokens.forEach(function (tok) {
      if (tok.type === "word") {
        var ph = transliterateWord(tok.text);
        var wrap = document.createElement("span");
        wrap.className = "word-pair";
        wrap.tabIndex = 0;
        wrap.setAttribute("role", "button");
        wrap.setAttribute("aria-label", "撳聽 " + tok.text + " 嘅讀音");
        wrap.title = "撳聽讀音";
        var de = document.createElement("span");
        de.className = "de";
        de.textContent = tok.text;
        var phEl = document.createElement("span");
        phEl.className = "ph";
        phEl.textContent = ph;
        wrap.appendChild(de);
        wrap.appendChild(phEl);
        wrap.addEventListener("click", function () { speak(tok.text); });
        wrap.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); speak(tok.text); }
        });
        container.appendChild(wrap);
      } else {
        tok.text.split("").forEach(function (ch) {
          if (ch === "\n") {
            container.appendChild(document.createElement("br"));
          } else if (ch === " " || ch === "\t") {
            // spacing handled by word-pair margins
          } else {
            var pwrap = document.createElement("span");
            pwrap.className = "punct-pair";
            var pde = document.createElement("span");
            pde.className = "de";
            pde.textContent = ch;
            var pph = document.createElement("span");
            pph.className = "ph";
            pph.textContent = "·";
            pwrap.appendChild(pde);
            pwrap.appendChild(pph);
            container.appendChild(pwrap);
          }
        });
      }
    });
  }

  function renderParagraph(text, tokens, container) {
    var wrap = document.createElement("div");
    wrap.className = "paragraph-view";

    var deLabel = document.createElement("div");
    deLabel.className = "block-label";
    deLabel.textContent = "原文";
    var deBlock = document.createElement("p");
    deBlock.className = "de-block";
    deBlock.textContent = text;

    var phLabel = document.createElement("div");
    phLabel.className = "block-label";
    phLabel.textContent = "拼音";
    var phBlock = document.createElement("p");
    phBlock.className = "ph-block";
    var phText = tokens.map(function (tok) {
      return tok.type === "word" ? transliterateWord(tok.text) : tok.text;
    }).join("");
    phBlock.textContent = phText;

    wrap.appendChild(deLabel);
    wrap.appendChild(deBlock);
    wrap.appendChild(phLabel);
    wrap.appendChild(phBlock);
    container.appendChild(wrap);
  }

  function renderOutput(text) {
    var output = document.getElementById("output");
    var copyBtn = document.getElementById("copyBtn");
    output.innerHTML = "";

    if (!text.trim()) {
      var hint = document.createElement("span");
      hint.className = "hint";
      hint.textContent = "先貼啲德文入去先啦。";
      output.appendChild(hint);
      copyBtn.hidden = true;
      output.classList.remove("show");
      void output.offsetWidth;
      output.classList.add("show");
      return;
    }

    var tokens = tokenize(text);
    if (viewMode === "cards") renderCards(tokens, output);
    else renderParagraph(text, tokens, output);

    output.classList.remove("show");
    void output.offsetWidth;
    output.classList.add("show");
    copyBtn.hidden = false;
  }

  function plainCopyText(text) {
    var tokens = tokenize(text);
    var phonetic = tokens.map(function (tok) {
      return tok.type === "word" ? transliterateWord(tok.text) : tok.text;
    }).join("");
    return text + "\n\n[拼音]\n" + phonetic;
  }

  function buildLegend() {
    var data = [
      { rule: "sch → sh", word: "Schule" },
      { rule: "ch → kh", word: "Bach" },
      { rule: "ei → eye", word: "nein" },
      { rule: "ie → ee", word: "wie" },
      { rule: "eu / äu → oy", word: "neu" },
      { rule: "au → ow", word: "Haus" },
      { rule: "ü → ew", word: "über" },
      { rule: "ö → ur", word: "schön" },
      { rule: "ä → eh", word: "Mädchen" },
      { rule: "v → f", word: "Vater" },
      { rule: "w → v", word: "Wasser" },
      { rule: "z → ts", word: "Zeit" },
      { rule: "j → y", word: "ja" },
      { rule: "ng → ng", word: "singen" },
      { rule: "字尾 -ig → ikh", word: "König" },
      { rule: "字尾 -er → uh", word: "Mutter" },
      { rule: "字頭 ver-/ent- 唔讀重音", word: "verstehen" }
    ];
    var tbody = document.querySelector("#legendTable tbody");
    data.forEach(function (row) {
      var tr = document.createElement("tr");
      var tdRule = document.createElement("td");
      tdRule.className = "rule-col";
      tdRule.textContent = row.rule;
      var tdEx = document.createElement("td");
      tdEx.className = "example-col";
      tdEx.colSpan = 2;
      var deSpan = document.createElement("span");
      deSpan.className = "de";
      deSpan.textContent = row.word;
      var phSpan = document.createElement("span");
      phSpan.className = "ph";
      phSpan.textContent = transliterateWord(row.word);
      tdEx.appendChild(deSpan);
      tdEx.appendChild(phSpan);
      tr.appendChild(tdRule);
      tr.appendChild(tdEx);
      tbody.appendChild(tr);
    });
  }

  // ---- Event wiring ----
  document.getElementById("convertBtn").addEventListener("click", function () {
    renderOutput(document.getElementById("input").value);
  });

  document.getElementById("clearBtn").addEventListener("click", function () {
    document.getElementById("input").value = "";
    renderOutput("");
  });

  document.getElementById("exampleBtn").addEventListener("click", function () {
    var examples = [
      "Guten Tag! Wie geht es dir? Ich lerne Deutsch.",
      "Ich möchte einen Kaffee, bitte.",
      "Das Wetter ist heute sehr schön.",
      "Können Sie mir bitte helfen?",
      "Entschuldigung, wo ist der Bahnhof?"
    ];
    var pick = examples[Math.floor(Math.random() * examples.length)];
    document.getElementById("input").value = pick;
    renderOutput(pick);
  });

  document.getElementById("copyBtn").addEventListener("click", function () {
    var text = document.getElementById("input").value;
    var btn = document.getElementById("copyBtn");
    try {
      navigator.clipboard.writeText(plainCopyText(text)).then(function () {
        var original = btn.textContent;
        btn.textContent = "已複製!";
        setTimeout(function () { btn.textContent = original; }, 1500);
      }).catch(function () {
        btn.textContent = "複製失敗,自己揀字抄啦";
        setTimeout(function () { btn.textContent = "複製結果"; }, 1800);
      });
    } catch (e) {
      btn.textContent = "呢部機唔支援自動複製";
      setTimeout(function () { btn.textContent = "複製結果"; }, 1800);
    }
  });

  document.getElementById("viewModeGroup").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    viewMode = btn.getAttribute("data-mode");
    Array.prototype.forEach.call(this.querySelectorAll("button"), function (b) {
      b.classList.toggle("active", b === btn);
    });
    renderOutput(document.getElementById("input").value);
  });

  document.getElementById("rateGroup").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-rate]");
    if (!btn) return;
    currentRate = parseFloat(btn.getAttribute("data-rate"));
    Array.prototype.forEach.call(this.querySelectorAll("button"), function (b) {
      b.classList.toggle("active", b === btn);
    });
  });

  document.getElementById("playAllBtn").addEventListener("click", function () {
    var btn = this;
    var text = document.getElementById("input").value;
    if (!text.trim()) return;
    btn.classList.add("speaking");
    speak(text, function () { btn.classList.remove("speaking"); });
  });

  buildLegend();
  renderOutput(document.getElementById("input").value);
})();
</script>
</body>
</html>
